PAYMENT_ENV = "production"
TURNSTILE_SITE_KEY = "0x4AAAAAAFG7j4wxLr72J4SS"
TURNSTILE_HOSTNAMES = "gilasart.ir,www.gilasart.ir,gilasartirac-svg.github.io"

[secrets]
required = ["TURNSTILE_SECRET_KEY"]

[triggers]
crons = ["*/15 * * * *"]
