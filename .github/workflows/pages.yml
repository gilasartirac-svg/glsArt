name: Deploy Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Check frontend JavaScript syntax
        run: node --check frontend/src/app.js

      - name: Test
        run: npm test

      - name: Verify Worker deployment for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            run=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/worker-deploy.yml/runs?head_sha=${{ github.sha }}&per_page=1")
            status=$(echo "$run" | jq -r '.workflow_runs[0].status // "missing"')
            conclusion=$(echo "$run" | jq -r '.workflow_runs[0].conclusion // ""')
            echo "worker status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then test "$conclusion" = "success"; break; fi
            sleep 10
          done
          test "${status:-missing}" = "completed"
          test "${conclusion:-failure}" = "success"

      - name: Verify live API before publishing Pages
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-all-errors https://gilasartworker.gilasart-ir-ac.workers.dev/api/health | tee /tmp/health.json
          node -e "const d=require('/tmp/health.json');if(d.ok!==true||d.db!==true)process.exit(1)"
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build frontend
        run: npm run build

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
