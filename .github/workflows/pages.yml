name: Deploy Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Publish maintenance screen
        run: |
          rm -rf dist
          mkdir -p dist
          cat > dist/index.html <<'EOF'
          <!doctype html>
          <html lang="fa" dir="rtl">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="robots" content="noindex,follow">
            <title>گیلاس آرت | در حال بروزرسانی</title>
            <style>
              *{box-sizing:border-box}
              html,body{margin:0;min-height:100%;background:#0b0b0d;color:#f6f2ea;font-family:Tahoma,Arial,sans-serif}
              body{min-height:100vh;display:grid;place-items:center;padding:24px}
              .box{width:min(620px,100%);text-align:center;border:1px solid #2b2a2d;border-radius:28px;padding:48px 28px;background:linear-gradient(145deg,#171519,#0f0f11);box-shadow:0 20px 70px #0008}
              .logo{color:#d8b36a;font-size:13px;letter-spacing:3px;margin-bottom:24px}
              .ring{width:54px;height:54px;margin:0 auto 28px;border:3px solid #2b2a2d;border-top-color:#d8b36a;border-radius:50%;animation:spin 1s linear infinite}
              h1{margin:0 0 14px;font-size:clamp(24px,6vw,38px)}
              p{margin:0;color:#aaa5a0;line-height:2;font-size:16px}
              @keyframes spin{to{transform:rotate(360deg)}}
              @media(prefers-reduced-motion:reduce){.ring{animation:none}}
            </style>
          </head>
          <body>
            <main class="box" role="status" aria-live="polite">
              <div class="logo">GILAS ART</div>
              <div class="ring" aria-hidden="true"></div>
              <h1>سیستم در حال بروزرسانی می‌باشد</h1>
              <p>لطفاً چند لحظه صبر کنید.<br>پس از پایان بروزرسانی، فروشگاه دوباره در دسترس خواهد بود.</p>
            </main>
          </body>
          </html>
          EOF

      - name: Upload maintenance artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy maintenance screen
        id: maintenance_deployment
        uses: actions/deploy-pages@v4

      - name: Build frontend
        run: npm run build

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
