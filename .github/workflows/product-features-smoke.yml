name: Product Features Smoke Test

on:
  push:
    branches: [feature/product-options-video-grid-fix]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Static checks
        run: |
          npm run check
          npm run build
          npm test
      - name: Apply product feature migration to remote D1
        run: npx wrangler d1 migrations apply gilasartdatabase --remote
      - name: Verify real D1 product data and pricing fixtures
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute gilasartdatabase --remote --json --command="SELECT COUNT(*) AS n FROM products WHERE sku LIKE 'GRID-TEST-%';" > /tmp/products.json
          node -e "const x=require('/tmp/products.json'); const n=Number(x[0]?.results?.[0]?.results?.[0]?.n ?? x[0]?.results?.[0]?.n ?? -1); if(n<3) throw new Error('Expected at least 3 real D1 grid test products, got '+n); console.log('D1 grid products:',n)"
          npx wrangler d1 execute gilasartdatabase --remote --command="SELECT a.name attribute,o.name option,o.is_default,o.price_delta_irt FROM product_attributes a JOIN product_attribute_options o ON o.attribute_id=a.id WHERE a.id IN ('attr_frame_color','attr_size') ORDER BY a.id,o.sort_order;" > /tmp/options.txt
          grep -q "طلایی" /tmp/options.txt && grep -q "100000" /tmp/options.txt
          grep -q "50×100" /tmp/options.txt && grep -q "300000" /tmp/options.txt
          grep -q "مشکی" /tmp/options.txt && grep -q "1" /tmp/options.txt
          echo "D1 product options and price deltas verified"
          npx wrangler d1 execute gilasartdatabase --remote --command="SELECT CASE WHEN p.price_irt=4100000 AND (SELECT COALESCE(SUM(o.price_delta_irt),0) FROM product_attribute_options o WHERE o.id IN ('opt_frame_gold','opt_size_50x100'))=400000 THEN 'PASS' ELSE 'FAIL' END AS check_result FROM products p WHERE p.sku='GRID-TEST-001';" > /tmp/pricing.txt
          grep -q "PASS" /tmp/pricing.txt
          echo "D1 pricing calculation verified: 4,500,000 IRR"
          npx wrangler d1 execute gilasartdatabase --remote --command="SELECT CASE WHEN EXISTS(SELECT 1 FROM pragma_table_info('products') WHERE name='video_url') THEN 'PASS' ELSE 'FAIL' END AS check_result;" > /tmp/video.txt
          grep -q "PASS" /tmp/video.txt
          echo "D1 video_url column verified"
