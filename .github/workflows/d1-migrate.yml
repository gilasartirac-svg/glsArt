name: Apply D1 Migrations

on:
  push:
    branches: [main]
    paths:
      - 'database/migrations/**'
      - 'wrangler.toml'
      - '.github/workflows/d1-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply remote D1 migrations
        run: npx wrangler d1 migrations apply gilasartdatabase --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
