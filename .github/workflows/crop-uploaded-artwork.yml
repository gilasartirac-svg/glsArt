name: Crop Uploaded Artwork Images

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/crop-uploaded-artwork.py"
      - ".github/workflows/crop-uploaded-artwork.yml"
  workflow_run:
    workflows: ["Production Quality Gate"]
    types: [completed]

permissions:
  contents: write

jobs:
  crop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Crop external white background
        run: python scripts/crop-uploaded-artwork.py

      - name: Verify filenames and extensions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("frontend/public/uploaded")
          allowed = {".jpg", ".jpeg", ".png", ".webp"}
          files = [p for p in root.iterdir() if p.is_file() and p.suffix.lower() in allowed]
          if not files:
              raise SystemExit("No uploaded artwork images found")
          for p in files:
              if p.name != p.name.strip():
                  raise SystemExit(f"Invalid filename: {p.name!r}")
          print(f"Verified {len(files)} uploaded image filenames/extensions")
          PY

      - name: Commit processed images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- frontend/public/uploaded; then
            echo "No image changes detected."
            exit 0
          fi
          git status --short -- frontend/public/uploaded
          git add frontend/public/uploaded
          git commit -m "perf: crop uploaded artwork image backgrounds"
          git push origin HEAD:main
