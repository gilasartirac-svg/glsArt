name: One-time Excel Catalog Import
on:
  push:
    branches: [main]
jobs:
  import:
    if: github.event.head_commit.message == 'data: import Excel catalog and customers'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check openpyxl
      - name: Build import SQL
        run: |
          python - <<'PY'
          import openpyxl,re,hashlib
          from pathlib import Path
          def q(v): return 'NULL' if v is None else "'"+str(v).replace("'","''")+"'"
          def clean(v): return re.sub(r'\s+',' ',str(v or '')).strip()
          def phone(v):
              s=str(v or '').strip().translate(str.maketrans('۰۱۲۳۴۵۶۷۸۹','0123456789')); s=re.sub(r'\D','',s)
              if len(s)==10 and s.startswith('9'): s='0'+s
              return s if re.fullmatch(r'09\d{9}',s) else None
          ps=list(openpyxl.load_workbook('frontend/public/uploaded/products.xlsx',data_only=True).active.iter_rows(min_row=2,values_only=True))
          rs=list(openpyxl.load_workbook('frontend/public/uploaded/orders.xlsx',data_only=True).active.iter_rows(min_row=2,values_only=True))
          if len(ps)!=270: raise SystemExit(f'Unexpected products rows: {len(ps)}')
          customers={}
          for r in rs:
              p=phone(r[0])
              if p and p!='09153090907' and p not in customers: customers[p]=r
          if len(customers)!=301: raise SystemExit(f'Unexpected valid customers: {len(customers)}')
          o=['PRAGMA foreign_keys=ON;','BEGIN;']
          o += ["DELETE FROM payment_attempts WHERE payment_id IN (SELECT id FROM payments WHERE order_id IN (SELECT id FROM orders WHERE is_sample=1));","DELETE FROM payments WHERE order_id IN (SELECT id FROM orders WHERE is_sample=1);","DELETE FROM coupon_usages WHERE order_id IN (SELECT id FROM orders WHERE is_sample=1);","DELETE FROM order_notes WHERE order_id IN (SELECT id FROM orders WHERE is_sample=1);","DELETE FROM shipping_tracking WHERE order_id IN (SELECT id FROM orders WHERE is_sample=1);","DELETE FROM order_status_history WHERE order_id IN (SELECT id FROM orders WHERE is_sample=1);","DELETE FROM order_items WHERE order_id IN (SELECT id FROM orders WHERE is_sample=1);","DELETE FROM orders WHERE is_sample=1;"]
          for u in ('usr_sample_01','usr_sample_02','usr_sample_03'):
              o += [f'DELETE FROM customer_group_members WHERE user_id={q(u)};',f'DELETE FROM customer_blocks WHERE user_id={q(u)};',f'DELETE FROM login_history WHERE user_id={q(u)};',f'DELETE FROM security_sessions WHERE user_id={q(u)};',f'DELETE FROM sessions WHERE user_id={q(u)};',f'DELETE FROM cart_items WHERE cart_id IN (SELECT id FROM carts WHERE user_id={q(u)});',f'DELETE FROM carts WHERE user_id={q(u)};',f'DELETE FROM favorites WHERE user_id={q(u)};',f'DELETE FROM reviews WHERE user_id={q(u)};',f'DELETE FROM addresses WHERE user_id={q(u)};',f'DELETE FROM users WHERE id={q(u)};']
          for p in ('sample_mehr','sample_shab','sample_khak','sample_barg','sample_sokoot','sample_atiq'):
              o += [f'DELETE FROM inventory_transactions WHERE product_id={q(p)};',f'DELETE FROM product_media WHERE product_id={q(p)};',f'DELETE FROM product_seo WHERE product_id={q(p)};',f'DELETE FROM product_variants WHERE product_id={q(p)};',f'DELETE FROM product_tag_map WHERE product_id={q(p)};',f'DELETE FROM related_products WHERE product_id={q(p)} OR related_product_id={q(p)};',f'DELETE FROM inventory WHERE product_id={q(p)};',f'DELETE FROM product_images WHERE product_id={q(p)};',f'DELETE FROM products WHERE id={q(p)};']
          o += ["DELETE FROM coupon_rules WHERE coupon_id IN ('coupon_sample_10','coupon_sample_fixed');","DELETE FROM coupons WHERE id IN ('coupon_sample_10','coupon_sample_fixed');"]
          for n,r in enumerate(ps,1):
              name=clean(r[0]); desc=clean(r[1]); price=int(r[4]); pic=clean(r[5]); pid=f'xls_{n:04d}'
              o.append(f"INSERT INTO products(id,category_id,slug,sku,name,description,price_irt,active) VALUES({q(pid)},NULL,{q('product-'+str(n).zfill(4))},{q('GA-XLS-'+str(n).zfill(4))},{q(name)},{q(desc)},{price},1);")
              o.append(f"INSERT INTO product_images(id,product_id,path,alt_text,sort_order,is_primary) VALUES({q('xlsimg_'+str(n).zfill(4))},{q(pid)},{q('/glsArt/uploaded/'+pic)},{q(name)},0,1);")
          for p,r in customers.items():
              uid='cust_'+hashlib.sha256(p.encode()).hexdigest()[:24]; name=clean(str(r[1] or '')+' '+str(r[2] or ''))
              o.append(f"INSERT INTO users(id,mobile,name) VALUES({q(uid)},{q(p)},{q(name)}) ON CONFLICT(mobile) DO UPDATE SET name=excluded.name,updated_at=CURRENT_TIMESTAMP;")
          o.append('COMMIT;'); Path('import.sql').write_text('\n'.join(o)+'\n',encoding='utf-8'); print('products',len(ps),'customers',len(customers))
          PY
      - name: Execute D1 import
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler@4.30.0 d1 execute gilasartdatabase --remote --file=import.sql --json
      - name: Verify
        run: npx wrangler@4.30.0 d1 execute gilasartdatabase --remote --command="SELECT (SELECT COUNT(*) FROM products) products,(SELECT COUNT(*) FROM product_images) product_images,(SELECT COUNT(*) FROM users WHERE id LIKE 'cust_%') imported_customers,(SELECT COUNT(*) FROM orders WHERE is_sample=1) sample_orders,(SELECT COUNT(*) FROM users WHERE id='usr_admin_gilasart') admin_user;" --json