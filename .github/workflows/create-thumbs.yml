name: Create 50 Percent Thumbnail Copies

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-thumbs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create thumbnails
        env:
          SOURCE: frontend/public/uploaded
          DEST: frontend/public/uploaded/thumb
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path("frontend/public/uploaded")
          dst = src / "thumb"
          dst.mkdir(parents=True, exist_ok=True)

          files = sorted(
              p for p in src.iterdir()
              if p.is_file() and p.suffix.lower() in {".jpeg", ".jpg", ".png"}
          )
          expected = files

          if not expected: raise SystemExit("No source images found")

          report = []
          for p in expected:
              with Image.open(p) as im:
                  w, h = im.size
                  nw, nh = max(1, w // 2), max(1, h // 2)
                  out = dst / p.name
                  if p.suffix.lower() == ".png":
                      im.resize((nw, nh), Image.Resampling.LANCZOS).save(out, format="PNG", optimize=True)
                  else:
                      rgb = im.convert("RGB") if im.mode not in ("RGB", "L") else im
                      rgb.resize((nw, nh), Image.Resampling.LANCZOS).save(out, format="JPEG", quality=90, optimize=True, progressive=True)
                  report.append(f"{p.name}\t{w}x{h}\t{nw}x{nh}")

          (dst / ".resize-verification.txt").write_text(
              f"source_count={len(expected)}\njpeg_count={sum(p.suffix.lower()=='.jpeg' for p in expected)}\njpg_count={sum(p.suffix.lower()=='.jpg' for p in expected)}\npng_count={sum(p.suffix.lower()=='.png' for p in expected)}\n" +
              "\n".join(report) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Commit generated thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/uploaded/thumb
          if git diff --cached --quiet; then echo "No thumbnail changes."; exit 0; fi
          git commit -m "feat: add 50 percent product image thumbnails"
          git push
