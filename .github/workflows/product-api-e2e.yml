name: Product API E2E Verification

on:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: https://gilasartworker.gilasart-ir-ac.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Find active admin and create temporary session
        id: session
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute gilasartdatabase --remote --json --command="SELECT u.id FROM users u JOIN admin_users au ON au.user_id=u.id AND au.active=1 ORDER BY u.id LIMIT 1;" > /tmp/admin.json
          ADMIN_ID=$(node -e "const x=require('/tmp/admin.json'); const r=x[0]?.results?.[0]?.results?.[0]; if(!r?.id) throw new Error('No active admin user exists in D1'); process.stdout.write(r.id)")
          SID=$(openssl rand -hex 32)
          echo "sid=$SID" >> "$GITHUB_OUTPUT"
          npx wrangler d1 execute gilasartdatabase --remote --command="INSERT INTO sessions(id,user_id,expires_at) VALUES('$SID','$ADMIN_ID',datetime('now','+10 minutes'));"
      - name: Verify admin products API against real D1
        run: |
          set -euo pipefail
          body=$(curl -fsS --retry 5 --retry-delay 5 -H "Cookie: __Host-gs_session=${{ steps.session.outputs.sid }}" "$WORKER_URL/api/admin/products")
          node -e 'const d=JSON.parse(process.argv[1]); if(!Array.isArray(d.items)) throw new Error("admin products API did not return items"); for(const sku of ["GRID-TEST-001","GRID-TEST-002","GRID-TEST-003"]){if(!d.items.some(x=>x.sku===sku)) throw new Error("missing "+sku)} console.log("Admin products API returned all 3 D1 grid test products.");' "$body"
      - name: Verify public product API exposes options and video field
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 5 "$WORKER_URL/api/products/mehr" > /tmp/product.json
          node -e 'const d=require("/tmp/product.json"); if(!d.product||!Array.isArray(d.attributes)||d.product.video_url===undefined) throw new Error("public product API contract missing attributes/video_url"); console.log("Public product API contract verified.");'
      - name: Remove temporary session
        if: always()
        run: |
          if [ -n "${{ steps.session.outputs.sid }}" ]; then npx wrangler d1 execute gilasartdatabase --remote --command="DELETE FROM sessions WHERE id='${{ steps.session.outputs.sid }}';"; fi
