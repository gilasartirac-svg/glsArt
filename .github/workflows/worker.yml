name: Worker Check
on: {push: {branches: [main]}}
jobs:
 check:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: 20}
   - run: node --check worker/src/index.js
   - run: node --check frontend/src/app.js
   - run: npm ci
   - run: npm test
