name: Temporary D1 Diagnostic
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    if: "!contains(github.event.head_commit.message, 'temporary D1 diagnostic state')"
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Capture D1 state
        run: |
          set -euo pipefail
          mkdir -p docs
          npx wrangler d1 execute gilasartdatabase --remote --command="SELECT name FROM d1_migrations ORDER BY id" --json > /tmp/migrations.json
          npx wrangler d1 execute gilasartdatabase --remote --command="SELECT name,type,sql FROM sqlite_master WHERE type IN ('table','index') ORDER BY name" --json > /tmp/schema.json
          node -e "const fs=require('fs');fs.writeFileSync('docs/.d1-diagnostic.json',JSON.stringify({migrations:JSON.parse(fs.readFileSync('/tmp/migrations.json')),schema:JSON.parse(fs.readFileSync('/tmp/schema.json'))},null,2)+'\\n')"
      - name: Commit diagnostic
        run: |
          git config user.name 'GilasArt Diagnostic'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/.d1-diagnostic.json
          git commit -m 'chore: temporary D1 diagnostic state'
          git push
