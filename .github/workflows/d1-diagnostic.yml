name: Temporary D1 Diagnostic
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    if: "!contains(github.event.head_commit.message, 'temporary D1 diagnostic state')"
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Capture D1 state
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p docs
          query() {
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/d1/database/3e6741e8-e50c-4c8d-b50a-33d9db2dfd4c/query" -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" --data "$1"
          }
          query '{"sql":"SELECT name FROM d1_migrations ORDER BY id"}' > /tmp/migrations.json
          query '{"sql":"SELECT name,type,sql FROM sqlite_master WHERE type IN (\"table\",\"index\") ORDER BY name"}' > /tmp/schema.json
          node -e "const fs=require('fs');fs.writeFileSync('docs/.d1-diagnostic.json',JSON.stringify({migrations:JSON.parse(fs.readFileSync('/tmp/migrations.json')),schema:JSON.parse(fs.readFileSync('/tmp/schema.json'))},null,2)+'\\n')"
      - name: Commit diagnostic
        run: |
          git config user.name 'GilasArt Diagnostic'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/.d1-diagnostic.json
          git commit -m 'chore: temporary D1 diagnostic state'
          git push
