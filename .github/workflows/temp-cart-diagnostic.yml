name: Temporary Cart Production Diagnostic
on:
  push:
    branches: [main]
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Inspect production cart schema
        run: |
          npx wrangler d1 execute gilasartdatabase --remote --command="SELECT name,sql FROM sqlite_master WHERE type='table' AND name IN ('carts','cart_items','product_attributes','product_attribute_options','product_attribute_assignments') ORDER BY name;" --json
      - name: Inspect migration state
        run: |
          npx wrangler d1 execute gilasartdatabase --remote --command="SELECT name FROM d1_migrations ORDER BY id DESC LIMIT 30;" --json
      - name: Inspect cart related columns and indexes
        run: |
          npx wrangler d1 execute gilasartdatabase --remote --command="SELECT m.name table_name,p.name column_name,p.type,p.pk FROM sqlite_master m JOIN pragma_table_info(m.name) p WHERE m.type='table' AND m.name IN ('carts','cart_items') ORDER BY m.name,p.cid; SELECT name,tbl_name,sql FROM sqlite_master WHERE type='index' AND tbl_name IN ('carts','cart_items') ORDER BY tbl_name,name;" --json
