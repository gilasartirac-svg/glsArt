name: Cloudflare Workers Usage Guard

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  usage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Query Cloudflare Workers usage
        id: usage
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          START="$(date -u +'%Y-%m-%dT00:00:00Z')"
          END="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          QUERY='query Usage($accountTag: string!, $startTime: Time!, $endTime: Time!, $startDate: Date!, $endDate: Date!, $scriptName: string!, $databaseId: string!) {
            viewer {
              accounts(filter: { accountTag: $accountTag }) {
                workersInvocationsAdaptive(limit: 10000, filter: { scriptName: $scriptName, datetime_geq: $startTime, datetime_leq: $endTime }) { sum { requests errors } }
                d1AnalyticsAdaptiveGroups(limit: 10000, filter: { databaseId: $databaseId, date_geq: $startDate, date_leq: $endDate }) { sum { rowsRead rowsWritten } }
              }
            }
          }'
          PAYLOAD="$(jq -n --arg q "$QUERY" --arg a "$CF_ACCOUNT_ID" --arg s "$START" --arg e "$END" '{query:$q,variables:{accountTag:$a,startTime:$s,endTime:$e,startDate:($s|split("T")[0]),endDate:($e|split("T")[0]),scriptName:"gilasartworker",databaseId:"3e6741e8-e50c-4c8d-b50a-33d9db2dfd4c"}}')"
          HTTP="$(curl -sS -o /tmp/cf.json -w '%{http_code}' \
            https://api.cloudflare.com/client/v4/graphql \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD")"
          cat /tmp/cf.json
          test "$HTTP" = "200"
          ERRORS="$(jq -r '.errors // empty' /tmp/cf.json)"
          test -z "$ERRORS"
          REQUESTS="$(jq '[.data.viewer.accounts[0].workersInvocationsAdaptive[]?.sum.requests // 0] | add // 0' /tmp/cf.json)"
          D1_READS="$(jq '[.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[]?.sum.rowsRead // 0] | add // 0' /tmp/cf.json)"
          D1_WRITES="$(jq '[.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups[]?.sum.rowsWritten // 0] | add // 0' /tmp/cf.json)"
          echo "requests=$REQUESTS"
          echo "d1_reads=$D1_READS"
          echo "d1_writes=$D1_WRITES"
          echo "requests=$REQUESTS" >> "$GITHUB_OUTPUT"
          echo "d1_reads=$D1_READS" >> "$GITHUB_OUTPUT"
          echo "d1_writes=$D1_WRITES" >> "$GITHUB_OUTPUT"

      - name: Update public service guard only when state changes
        env:
          REQUESTS: ${{ steps.usage.outputs.requests }}
          D1_READS: ${{ steps.usage.outputs.d1_reads }}
          D1_WRITES: ${{ steps.usage.outputs.d1_writes }}
        run: |
          set -euo pipefail
          NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          LIMIT=100000
          WORKER_PAUSE_THRESHOLD=95000
          D1_READ_LIMIT=5000000
          D1_WRITE_LIMIT=100000
          D1_READ_PAUSE_THRESHOLD=4750000
          D1_WRITE_PAUSE_THRESHOLD=95000
          if [ "$REQUESTS" -ge "$WORKER_PAUSE_THRESHOLD" ]; then
            PAUSED=true
            MESSAGE="فروشگاه گیلاس آرت در حال انجام به‌روزرسانی و آماده‌سازی برای ارائه خدمات بهتر است."
          elif [ "$D1_READS" -ge "$D1_READ_PAUSE_THRESHOLD" ]; then
            PAUSED=true
            MESSAGE="فروشگاه گیلاس آرت در حال انجام به‌روزرسانی و آماده‌سازی برای ارائه خدمات بهتر است."
          elif [ "$D1_WRITES" -ge "$D1_WRITE_PAUSE_THRESHOLD" ]; then
            PAUSED=true
            MESSAGE="فروشگاه گیلاس آرت در حال انجام به‌روزرسانی و آماده‌سازی برای ارائه خدمات بهتر است."
          else
            PAUSED=false
            MESSAGE="سرویس فروشگاه فعال است."
          fi
          export PAUSED REQUESTS D1_READS D1_WRITES NOW MESSAGE
          node -e 'const fs=require("fs");const p="frontend/public/service-status.json";const old=JSON.parse(fs.readFileSync(p,"utf8"));const next={paused:process.env.PAUSED==="true",requests:Number(process.env.REQUESTS||0),d1RowsRead:Number(process.env.D1_READS||0),d1RowsWritten:Number(process.env.D1_WRITES||0),limit:100000,d1ReadLimit:5000000,d1WriteLimit:100000,checkedAt:process.env.NOW,message:process.env.MESSAGE};fs.writeFileSync("/tmp/status.json",JSON.stringify(next,null,2)+"\n");if(old.paused!==next.paused)process.exit(10)' || code=$?
          if [ "${code:-0}" -eq 10 ]; then
            cp /tmp/status.json frontend/public/service-status.json
          fi
          if git diff --quiet -- frontend/public/service-status.json; then
            echo "No service-state transition; no commit."
            exit 0
          fi
          git config user.name "GilasArt Cloudflare Guard"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/service-status.json
          git commit -m "chore: update Cloudflare service guard state"
          git push
