name: Temporary Rewards Redemption Verification

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Wait for rewards migration
        run: |
          for i in $(seq 1 30); do
            if npx wrangler d1 execute gilasartdatabase --remote --command="SELECT name FROM sqlite_master WHERE type='table' AND name='loyalty_points'" --json | grep -q 'loyalty_points'; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Create test user, cart and 400 points
        run: |
          npx wrangler d1 execute gilasartdatabase --remote --command="INSERT OR IGNORE INTO users(id,mobile,name) VALUES('reward-redemption-test','09990000002','Reward Redemption Test'); INSERT OR IGNORE INTO loyalty_points(id,user_id,points,event_type,reference_type,reference_id,description) VALUES('reward-redemption-points','reward-redemption-test',400,'test_fixture','test','reward-redemption','400 test points'); INSERT OR REPLACE INTO carts(id,user_id) VALUES('reward-redemption-cart','reward-redemption-test'); INSERT OR REPLACE INTO cart_items(cart_id,product_id,quantity,options_json) SELECT 'reward-redemption-cart',id,1,'[]' FROM products WHERE active=1 ORDER BY created_at DESC,id DESC LIMIT 1; INSERT OR REPLACE INTO sessions(id,user_id,expires_at) VALUES('reward-redemption-session','reward-redemption-test',datetime('now','+1 day'));"
      - name: Redeem 400 points and verify 20 percent coupon
        run: |
          redeem=$(curl -fsS -X POST "https://gilasartworker.gilasart-ir-ac.workers.dev/api/rewards/redeem" -H "content-type: application/json" -H "x-csrf-token: reward-redemption-csrf" -H "cookie: __Host-gs_session=reward-redemption-session; gs_csrf=reward-redemption-csrf" --data '{"points":400}')
          echo "$redeem"
          code=$(node -e "const d=JSON.parse(process.argv[1]); if(!d.ok||!d.coupon||Number(d.coupon.value)!==20||Number(d.balance)!==0)process.exit(1); process.stdout.write(d.coupon.code)" "$redeem")
          body=$(curl -fsS -X POST "https://gilasartworker.gilasart-ir-ac.workers.dev/api/cart/price" -H "content-type: application/json" -H "x-csrf-token: reward-redemption-csrf" -H "cookie: __Host-gs_session=reward-redemption-session; gs_csrf=reward-redemption-csrf" --data "{\"code\":\"$code\"}")
          echo "$body"
          node -e "const d=JSON.parse(process.argv[1]); if(!d.total_irt||Number(d.coupon_discount_irt)!==Math.floor(Number(d.subtotal_irt)*0.20)||Number(d.total_irt)!==Number(d.subtotal_irt)-Number(d.discount_irt)+Number(d.shipping_irt))process.exit(1)" "$body"
      - name: Cleanup
        if: always()
        run: |
          npx wrangler d1 execute gilasartdatabase --remote --command="DELETE FROM coupon_usages WHERE user_id='reward-redemption-test'; DELETE FROM cart_items WHERE cart_id='reward-redemption-cart'; DELETE FROM carts WHERE id='reward-redemption-cart'; DELETE FROM sessions WHERE id='reward-redemption-session'; DELETE FROM coupons WHERE user_id='reward-redemption-test'; DELETE FROM loyalty_points WHERE user_id='reward-redemption-test'; DELETE FROM users WHERE id='reward-redemption-test';"
