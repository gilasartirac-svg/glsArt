name: Deploy Worker + D1 (Production)

on:
  push:
    branches: [main]

concurrency:
  group: worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_BOOTSTRAP_MOBILE: ${{ secrets.ADMIN_BOOTSTRAP_MOBILE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify Cloudflare CI credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1)
          test -n "$ADMIN_BOOTSTRAP_MOBILE" || echo "::warning::ADMIN_BOOTSTRAP_MOBILE is not configured; existing DB admin assignments remain unchanged"

      - name: Inspect remote D1 schema before migrations
        run: |
          echo '--- migration history ---'
          npx wrangler d1 execute gilasartdatabase --remote --command="SELECT id,name,applied_at FROM d1_migrations ORDER BY id" --json || true
          echo '--- tables ---'
          npx wrangler d1 execute gilasartdatabase --remote --command="SELECT name,type FROM sqlite_master WHERE type IN ('table','view') ORDER BY type,name" --json
          echo '--- key columns ---'
          npx wrangler d1 execute gilasartdatabase --remote --command="SELECT 'users' table_name,name,type FROM pragma_table_info('users') UNION ALL SELECT 'orders',name,type FROM pragma_table_info('orders') UNION ALL SELECT 'inventory',name,type FROM pragma_table_info('inventory') UNION ALL SELECT 'payments',name,type FROM pragma_table_info('payments') ORDER BY table_name,cid" --json

      - name: Apply remote D1 migrations
        run: npx wrangler d1 migrations apply gilasartdatabase --remote

      - name: Sync admin bootstrap secret
        if: env.ADMIN_BOOTSTRAP_MOBILE != ''
        run: printf '%s' "$ADMIN_BOOTSTRAP_MOBILE" | npx wrangler secret put ADMIN_BOOTSTRAP_MOBILE --config wrangler.toml

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.toml
