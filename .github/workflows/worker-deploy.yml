name: Deploy Worker + D1 (Production)

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_BOOTSTRAP_MOBILE: ${{ secrets.ADMIN_BOOTSTRAP_MOBILE }}
      KAVENEGAR_API_KEY: ${{ secrets.KAVENEGAR_API_KEY }}
      OTP_PEPPER: ${{ secrets.OTP_PEPPER }}
      KAVENEGAR_SENDER: ${{ secrets.KAVENEGAR_SENDER }}
    steps:
      - uses: actions/checkout@v4
      - name: Read service deployment state
        id: service
        run: |
          set -euo pipefail
          paused=$(node -e "const d=require('./frontend/public/service-status.json');process.stdout.write(String(d.paused===true))")
          echo "paused=$paused"
          echo "paused=$paused" >> "$GITHUB_OUTPUT"


      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify Cloudflare CI credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1)
          test -n "$ADMIN_BOOTSTRAP_MOBILE" || echo "::warning::ADMIN_BOOTSTRAP_MOBILE is not configured; existing DB admin assignments remain unchanged"
          test -n "$OTP_PEPPER" || (echo "::error::OTP_PEPPER is missing; refusing a production deploy without OTP security secret"; exit 1)
          test -n "$KAVENEGAR_API_KEY" || (echo "::error::KAVENEGAR_API_KEY is missing; refusing a production deploy without SMS provider"; exit 1)
          test -n "$KAVENEGAR_SENDER" || (echo "::error::KAVENEGAR_SENDER is missing; refusing a production deploy without SMS sender"; exit 1)

      - name: Adopt existing D1 baseline migration
        if: steps.service.outputs.paused != 'true'
        run: |
          set -euo pipefail
          sql="CREATE TABLE IF NOT EXISTS d1_migrations(id INTEGER PRIMARY KEY AUTOINCREMENT,name TEXT UNIQUE,applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL); INSERT OR IGNORE INTO d1_migrations(name) SELECT '0001_initial.sql' WHERE (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('users','sessions','otp_challenges','roles','permissions','user_roles','categories','products','product_images','inventory','addresses','carts','cart_items','orders','order_items','payments','payment_attempts','favorites','reviews','coupons','coupon_usages','audit_logs'))>=22 AND NOT EXISTS (SELECT 1 FROM d1_migrations WHERE name='0001_initial.sql');"
          for attempt in 1 2 3 4 5; do npx wrangler d1 execute gilasartdatabase --remote --command="$sql" --json && break; echo "D1 busy/error, retry $attempt"; sleep 5; done

      - name: Adopt existing order sample flag
        if: steps.service.outputs.paused != 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do npx wrangler d1 execute gilasartdatabase --remote --command="PRAGMA table_info(orders)" --json > /tmp/orders-schema.json && break; sleep 5; done
          if jq -e '.[0].results[]? | select(.name=="is_sample")' /tmp/orders-schema.json >/dev/null; then
            npx wrangler d1 execute gilasartdatabase --remote --command="INSERT OR IGNORE INTO d1_migrations(name) VALUES ('0010_add_order_sample_flag.sql')" --json
          else
            echo "orders.is_sample is absent; migration 0010 will be applied normally."
          fi

      - name: Reconcile legacy review compatibility migration
        if: steps.service.outputs.paused != 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do npx wrangler d1 execute gilasartdatabase --remote --command="PRAGMA table_info(reviews)" --json > /tmp/reviews-schema.json && break; sleep 5; done
          if jq -e '.[0].results[]? | select(.name=="body")' /tmp/reviews-schema.json >/dev/null; then
            npx wrangler d1 execute gilasartdatabase --remote --command="INSERT OR IGNORE INTO d1_migrations(name) VALUES ('0001a_reviews_schema_compat.sql')" --json
          else
            echo "reviews.body is absent; compatibility migration must run normally."
          fi

      - name: Reconcile existing core schema migrations
        if: steps.service.outputs.paused != 'true'
        run: |
          set -euo pipefail
          for name in 0002_hardening.sql 0003_admin_enterprise.sql 0004_admin_audit_upgrade.sql 0005_permission_matrix.sql 0006_checkout_idempotency.sql 0007_catalog_seo_seed.sql 0008_admin_bootstrap_and_sample_data.sql 0009_stock_reservations.sql; do
            npx wrangler d1 execute gilasartdatabase --remote --command="INSERT OR IGNORE INTO d1_migrations(name) VALUES ('$name')" --json
          done

      - name: Apply remote D1 migrations
        if: steps.service.outputs.paused != 'true'
        run: npx wrangler d1 migrations apply gilasartdatabase --remote

      - name: Deploy Worker code
        if: steps.service.outputs.paused != 'true'
        run: npx wrangler deploy --config wrangler.toml

      - name: Sync Worker secrets in one deployment
        if: steps.service.outputs.paused != 'true'
        run: |
          set -euo pipefail
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          node - "$secret_file" <<'NODE'
          const fs = require('node:fs');
          const output = process.argv[2];
          const required = ['OTP_PEPPER', 'KAVENEGAR_API_KEY', 'KAVENEGAR_SENDER'];
          const secrets = {};
          for (const key of required) {
            const value = process.env[key];
            if (!value) throw new Error('Required Worker secret is missing: ' + key);
            secrets[key] = value;
          }
          // Preserve the existing bootstrap secret when the optional GitHub secret is not configured.
          if (process.env.ADMIN_BOOTSTRAP_MOBILE) {
            secrets.ADMIN_BOOTSTRAP_MOBILE = process.env.ADMIN_BOOTSTRAP_MOBILE;
          }
          fs.writeFileSync(output, JSON.stringify(secrets), { mode: 0o600 });
          NODE
          npx wrangler secret bulk "$secret_file" --config wrangler.toml
