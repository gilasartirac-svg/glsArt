name: Deploy Worker + D1 (Production)

on:
  push:
    branches: [main]

concurrency:
  group: worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_BOOTSTRAP_MOBILE: ${{ secrets.ADMIN_BOOTSTRAP_MOBILE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify Cloudflare CI credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1)
          test -n "$ADMIN_BOOTSTRAP_MOBILE" || echo "::warning::ADMIN_BOOTSTRAP_MOBILE is not configured; existing DB admin assignments remain unchanged"

      - name: Inspect remote D1 schema before migrations
        run: |
          npx wrangler d1 execute gilasartdatabase --remote --command="SELECT 'migration_history' AS item, COALESCE(group_concat(name, '|'),'EMPTY') AS value FROM d1_migrations UNION ALL SELECT 'tables', group_concat(name, '|') FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' UNION ALL SELECT 'users_columns', COALESCE((SELECT group_concat(name, '|') FROM pragma_table_info('users')),'MISSING') UNION ALL SELECT 'categories_columns', COALESCE((SELECT group_concat(name, '|') FROM pragma_table_info('categories')),'MISSING') UNION ALL SELECT 'orders_columns', COALESCE((SELECT group_concat(name, '|') FROM pragma_table_info('orders')),'MISSING') UNION ALL SELECT 'payments_columns', COALESCE((SELECT group_concat(name, '|') FROM pragma_table_info('payments')),'MISSING')" --remote --json

      - name: Apply remote D1 migrations
        run: npx wrangler d1 migrations apply gilasartdatabase --remote

      - name: Sync admin bootstrap secret
        if: env.ADMIN_BOOTSTRAP_MOBILE != ''
        run: printf '%s' "$ADMIN_BOOTSTRAP_MOBILE" | npx wrangler secret put ADMIN_BOOTSTRAP_MOBILE --config wrangler.toml

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.toml
