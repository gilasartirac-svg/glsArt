name: Deploy Worker + D1 (Production)

on:
  push:
    branches: [main]

concurrency:
  group: worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_BOOTSTRAP_MOBILE: ${{ secrets.ADMIN_BOOTSTRAP_MOBILE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify Cloudflare CI credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1)
          test -n "$ADMIN_BOOTSTRAP_MOBILE" || echo "::warning::ADMIN_BOOTSTRAP_MOBILE is not configured; existing DB admin assignments remain unchanged"

      - name: Adopt existing D1 baseline migration
        run: |
          npx wrangler d1 execute gilasartdatabase --remote --command="CREATE TABLE IF NOT EXISTS d1_migrations(id INTEGER PRIMARY KEY AUTOINCREMENT,name TEXT UNIQUE,applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL); INSERT OR IGNORE INTO d1_migrations(name) SELECT '0001_initial.sql' WHERE (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('users','sessions','otp_challenges','roles','permissions','user_roles','categories','products','product_images','inventory','addresses','carts','cart_items','orders','order_items','payments','payment_attempts','favorites','reviews','coupons','coupon_usages','audit_logs'))=22 AND NOT EXISTS (SELECT 1 FROM d1_migrations WHERE name='0001_initial.sql');" --remote --json

      - name: Adopt existing order sample flag
        run: |
          npx wrangler d1 execute gilasartdatabase --remote --command="INSERT OR IGNORE INTO d1_migrations(name) SELECT '0010_add_order_sample_flag.sql' WHERE EXISTS (SELECT 1 FROM pragma_table_info('orders') WHERE name='is_sample') AND NOT EXISTS (SELECT 1 FROM d1_migrations WHERE name='0010_add_order_sample_flag.sql');" --remote --json

      - name: Apply remote D1 migrations
        run: npx wrangler d1 migrations apply gilasartdatabase --remote

      - name: Sync admin bootstrap secret
        if: env.ADMIN_BOOTSTRAP_MOBILE != ''
        run: printf '%s' "$ADMIN_BOOTSTRAP_MOBILE" | npx wrangler secret put ADMIN_BOOTSTRAP_MOBILE --config wrangler.toml

      - name: Inspect D1 import state
        run: npx wrangler d1 execute gilasartdatabase --remote --command="SELECT (SELECT COUNT(*) FROM products) products,(SELECT COUNT(*) FROM products WHERE id LIKE 'xls_%') excel_products,(SELECT COUNT(*) FROM product_images WHERE id LIKE 'xlsimg_%') excel_images,(SELECT COUNT(*) FROM users WHERE id LIKE 'cust_%') excel_customers,(SELECT COUNT(*) FROM orders WHERE is_sample=1) sample_orders,(SELECT COUNT(*) FROM users WHERE id='usr_admin_gilasart') admin_user; SELECT id,sku,name FROM products ORDER BY id LIMIT 50; SELECT o.id,o.user_id,u.mobile,o.status,oi.product_id,oi.sku,oi.name FROM orders o JOIN users u ON u.id=o.user_id JOIN order_items oi ON oi.order_id=o.id WHERE oi.product_id IN ('prod_demo','sample_barg','sample_atiq','sample_sokoot','test_grid_01','test_grid_02','test_grid_03') ORDER BY o.created_at DESC LIMIT 100;" --json

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.toml
