name: Security Regression Tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - security-hardening-2026-09

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Static checks
        run: npm run check
      - name: Security regression tests
        run: node --test tests/*.test.mjs
