name: Cloudflare Usage Probe

on:
  push:
    paths:
      - ".github/workflows/cloudflare-usage-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query current Worker request count
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          START="$(date -u +'%Y-%m-%dT00:00:00Z')"
          END="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n --arg q 'query WorkersUsage($accountTag: string!, $start: Time!, $end: Time!, $scriptName: string!) { viewer { accounts(filter: { accountTag: $accountTag }) { workersInvocationsAdaptive(limit: 10000, filter: { scriptName: $scriptName, datetime_geq: $start, datetime_leq: $end }) { sum { requests errors } } } } }' --arg a "$CF_ACCOUNT_ID" --arg s "$START" --arg e "$END" '{query:$q,variables:{accountTag:$a,start:$s,end:$e,scriptName:"gilasartworker"}}' > /tmp/payload.json
          HTTP="$(curl -sS -o /tmp/cf.json -w '%{http_code}' https://api.cloudflare.com/client/v4/graphql -H "Authorization: Bearer $CF_API_TOKEN" -H "Content-Type: application/json" --data @/tmp/payload.json)"
          cat /tmp/cf.json
          test "$HTTP" = "200"
          test "$(jq '.errors // null' /tmp/cf.json)" = "null"
          REQUESTS="$(jq '[.data.viewer.accounts[0].workersInvocationsAdaptive[]?.sum.requests // 0] | add // 0' /tmp/cf.json)"
          ERRORS="$(jq '[.data.viewer.accounts[0].workersInvocationsAdaptive[]?.sum.errors // 0] | add // 0' /tmp/cf.json)"
          echo "REAL_WORKER_REQUESTS_TODAY=$REQUESTS"
          echo "REAL_WORKER_ERRORS_TODAY=$ERRORS"
          printf '{"checkedAt":"%s","requests":%s,"errors":%s,"limit":100000,"worker":"gilasartworker"}\n' "$END" "$REQUESTS" "$ERRORS" > frontend/public/cloudflare-usage-now.json
          git config user.name "GilasArt Cloudflare Probe"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/cloudflare-usage-now.json
          git commit -m "chore: record Cloudflare usage probe"
          git push
