name: Temporary Review Import Check

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Inspect products and review users
        run: |
          npx wrangler d1 execute gilasartdatabase --remote --command="SELECT id,slug,name,created_at FROM products WHERE active=1 ORDER BY created_at DESC,id DESC LIMIT 25" --json
          echo '--- USERS ---'
          npx wrangler d1 execute gilasartdatabase --remote --command="SELECT id,name,mobile FROM users ORDER BY created_at DESC LIMIT 10" --json
