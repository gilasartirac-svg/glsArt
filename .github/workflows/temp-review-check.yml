name: Temporary Review Import Check

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Inspect product mapping
        run: |
          npx wrangler d1 execute gilasartdatabase --remote --command="SELECT COUNT(*) AS total_products, SUM(CASE WHEN active=1 THEN 1 ELSE 0 END) AS active_products FROM products" --json
          npx wrangler d1 execute gilasartdatabase --remote --command="SELECT row_number() OVER (ORDER BY CAST(substr(slug,6) AS INTEGER) DESC) AS rn,id,slug FROM products WHERE active=1 ORDER BY rn LIMIT 20" --json
          npx wrangler d1 execute gilasartdatabase --remote --command="SELECT row_number() OVER (ORDER BY created_at DESC,id DESC) AS rn,id,slug FROM products WHERE active=1 AND slug IN ('Gilas400','Gilas390') ORDER BY rn" --json
          npx wrangler d1 execute gilasartdatabase --remote --command="SELECT COUNT(*) AS total_reviews FROM reviews" --json
          npx wrangler d1 execute gilasartdatabase --remote --command="SELECT p.sku,p.name,COUNT(r.id) AS total_reviews,SUM(CASE WHEN r.approved=1 THEN 1 ELSE 0 END) AS approved_reviews FROM products p LEFT JOIN reviews r ON r.product_id=p.id GROUP BY p.id,p.sku,p.name HAVING COUNT(r.id)>0 ORDER BY CAST(substr(lower(p.sku),6) AS INTEGER),p.id" --json
          npx wrangler d1 execute gilasartdatabase --remote --command="SELECT COUNT(*) AS approved_reviews FROM reviews WHERE approved=1" --json
