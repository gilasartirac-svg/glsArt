name: Production Quality Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate all production JavaScript and module links
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |f| YAML.parse_file(f); puts "YAML PASS: #{f}" }'
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const roots=['frontend/src','frontend/public'];
          const files=[];
          function walk(dir){
            for(const e of fs.readdirSync(dir,{withFileTypes:true})){
              const p=path.join(dir,e.name);
              if(e.isDirectory()) walk(p);
              else if(e.isFile() && /\.js$/i.test(e.name)) files.push(p);
            }
          }
          roots.forEach(walk);
          const active=files.filter(f=>!/\.(?:backup|broken|corrupted)(?:\.|$)/i.test(f)&&!/\.before-[^/]+\.js$/i.test(f));
          for(const f of active){
            const src=fs.readFileSync(f,'utf8');
            if(/\bimport\s*\(/.test(src)||/^\s*import\s/m.test(src)||/^\s*export\s/m.test(src)){
              // Syntax is checked by node --check below; here we verify relative module targets.
              const refs=[];
              const re=/(?:import|export)\s+(?:[\s\S]*?\s+from\s+)?['"](\.\/?[^'"]+)['"]/g;
              let m;
              while((m=re.exec(src))) refs.push(m[1]);
              const dyn=/import\(\s*['"](\.\/?[^'"]+)['"]\s*\)/g;
              while((m=dyn.exec(src))) refs.push(m[1]);
              for(const ref of refs){
                if(!ref.startsWith('.')) continue;
                const clean=ref.split('?')[0].split('#')[0];
                const candidates=[clean,path.extname(clean)?null:clean+'.js',clean+'/index.js'].filter(Boolean);
                if(!candidates.some(x=>fs.existsSync(path.resolve(path.dirname(f),x)))){
                  throw new Error('Missing relative module: '+f+' -> '+ref);
                }
              }
            }
          }
          for(const f of active){
            const r=require('child_process').spawnSync(process.execPath,['--check',f],{encoding:'utf8'});
            if(r.status!==0){console.error(r.stderr||r.stdout);process.exit(r.status||1)}
            console.log('JS PASS: '+f);
          }
          NODE
      - name: Validate Worker module
        run: cp worker/src/index.js /tmp/gilasart-worker.mjs && node --check /tmp/gilasart-worker.mjs
      - name: Validate Persian-only storefront language contract
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('frontend/src/app.js','utf8');
          const d=JSON.parse(fs.readFileSync('frontend/public/i18n/fa.json','utf8'));
          if(d.version!==1||d.locale!=='fa'||d.direction!=='rtl')throw new Error('invalid Persian locale metadata');
          if(!app.includes("const SUPPORTED_LOCALES=['fa']"))throw new Error('storefront must be Persian-only');
          if(app.includes('/api/locale')||app.includes('gilasart_locale=')||app.includes('language-switcher-toggle'))throw new Error('customer language switching/detection still exposed');
          if(!app.includes("async function bootstrapLocale(){await loadLocale();setLocale();}"))throw new Error('Persian bootstrap contract missing');
          console.log('Persian-only storefront language contract: PASS');
          NODE
      - name: Validate shared shell i18n contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const c=fs.readFileSync('frontend/src/app.js','utf8');
          const ranges=[
            ['layout','function layout(content){','function routeBase()'],
            ['footer','function renderFooter(){','function updateCartBadge'],
          ];
          for(const [name,a,b] of ranges){
            const i=c.indexOf(a),j=c.indexOf(b,i+1);
            if(i<0||j<0) throw new Error('missing shared '+name);
            const s=c.slice(i,j);
            if(!s.includes("t('")) throw new Error(name+' has no i18n usage');
            if(/aria-label="(?:Language|گیلاس آرت، صفحه اصلی|سبد خرید|منوی اصلی|باز کردن منوی اصلی|بستن منوی اصلی)"/.test(s)) throw new Error(name+' contains hard-coded shared accessibility label');
          }
          const d=JSON.parse(fs.readFileSync('frontend/public/i18n/fa.json','utf8'));
          for(const key of ['nav.shop','nav.about','nav.contact','nav.news','nav.articles','nav.rewards','nav.admin','nav.cart','nav.login','nav.profile','nav.dayNight','nav.openMenu','nav.closeMenu','footer.quick','footer.shop','footer.terms','footer.rewards','footer.support','footer.contact','footer.social','footer.trust','footer.rights','header.theme','header.themeTitle','update.close']){
            if(typeof d.strings?.[key]!=='string'||!d.strings[key].trim()) throw new Error('missing Persian shared key '+key);
          }
          console.log('shared shell i18n contract: PASS');
          NODE
      - name: Validate Shop i18n contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('frontend/src/app.js','utf8');
          const i=app.indexOf('async function shop()'),j=app.indexOf('async function product',i);
          if(i<0||j<0)throw new Error('shop function boundaries missing');
          const s=app.slice(i,j);
          const required=['shop.title','shop.description','shop.search','shop.searchHint','shop.searchPlaceholder','shop.searchAria','shop.categories','shop.categoriesHint','shop.allWorks','shop.categoryWorks','shop.filters','shop.filtersHint','shop.priceRange','shop.from','shop.to','shop.minPrice','shop.maxPrice','shop.buyerRating','shop.allRatings','shop.clearAll','shop.sort','shop.sortHint','shop.sortBy','shop.newest','shop.buyerRecommended','shop.bestSelling','shop.popular','shop.bestRated','shop.mostReviewed','shop.priceLow','shop.priceHigh','shop.available','shop.results','shop.more','shop.preparing','shop.continue','shop.allShown','shop.noMatch','shop.empty','shop.error'];
          for(const key of required)if(!s.includes("t('"+key+"')"))throw new Error('Shop UI is not localized: '+key);
          const d=JSON.parse(fs.readFileSync('frontend/public/i18n/fa.json','utf8'));for(const key of required)if(typeof d.strings?.[key]!=='string'||!d.strings[key].trim())throw new Error('missing Shop Persian key '+key)
          for(const raw of ['جستجو، فیلتر و انتخاب آثار گیلاس آرت','انتخاب چند دسته','محدوده قیمت','امتیاز خریداران','پاک کردن همه','نمایش آثار بیشتر','در حال آماده‌سازی گالری…','نتیجه‌ای پیدا نشد.'])if(s.includes(raw))throw new Error('hard-coded Shop UI text remains: '+raw);
          console.log('Shop i18n contract: PASS');
          NODE
      - name: Validate Product Detail contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('frontend/src/app.js','utf8');
          const i=app.indexOf('async function product(slug)'),j=app.indexOf('async function ensureLogin()',i);
          if(i<0||j<0)throw new Error('product function boundaries missing');
          const p=app.slice(i,j);
          for(const token of ['attributes=d.attributes||[]','product-option-input','selections=()=>','options:selections()','product-live-price','product-stock-status','product-purchase-messages','product-related-panel','relatedProducts','recalc=','product-qty-minus','product-qty-plus','quantityDiscountTiers','review-form'])if(!p.includes(token))throw new Error('Product Detail contract missing: '+token);
          if(!app.includes('translateRenderedContent(app)'))throw new Error('Product Detail render translation hook missing');
          const required=['product.videoUnsupported','product.selectAttributes','product.saved','product.cartQuantity','product.decrease','product.increase','product.selectedQuantity','product.bulkSave','product.bulkText','product.units','product.bulkAuto','product.noReviews','product.yourReview','product.reviewPlaceholder','product.submitReview','product.reviewPending','product.reactionError','product.sessionExpired','product.added','product.addError','product.addErrorShort','product.quantityError','product.optionUpdateError','product.gallery','product.inStock','product.outOfStock','product.purchaseMessage','product.related'];
          const d=JSON.parse(fs.readFileSync('frontend/public/i18n/fa.json','utf8'));for(const key of required)if(typeof d.strings?.[key]!=='string'||!d.strings[key].trim())throw new Error('missing Product Detail Persian key '+key)
          console.log('Product Detail contract: PASS');
          NODE
      - name: Validate Home i18n contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('frontend/src/app.js','utf8');
          const i=app.indexOf('async function home()'),j=app.indexOf('async function shop()',i);
          if(i<0||j<0)throw new Error('home function boundaries missing');
          const home=app.slice(i,j);
          const required=['home.copperEyebrow','home.copperTitle','home.copperText','home.copperCta','home.copperAbout','home.collectionsEyebrow','home.collections','home.collectionsText','home.viewAll','home.categoryView','home.galleryArt','home.virtualGalleryTitle','home.virtualGalleryText','home.virtualGalleryCta','home.virtualGalleryLabel','home.latestEyebrow','home.latest','home.latestActive','home.allWorks','home.copperLatestText','home.noActive'];
          for(const key of required)if(!home.includes("t('"+key+"')"))throw new Error('Home UI is not localized: '+key);
          const d=JSON.parse(fs.readFileSync('frontend/public/i18n/fa.json','utf8'));for(const key of required)if(typeof d.strings?.[key]!=='string'||!d.strings[key].trim())throw new Error('missing Home Persian key '+key);
          for(const raw of ['مجموعه‌های گالری','پیشنهاد شگفت‌انگیز','آثاری برای خانه‌هایی که داستان دارند.','انتخاب اثر، بخشی از زیبایی آن است.','هنرکده گیلاس آرت','کشف','انتخاب','سفارش','تولید کننده ی برتر تابلو های معرق مس در ایران'])if(home.includes(raw))throw new Error('hard-coded obsolete Home UI text remains: '+raw);
          for(const obsolete of ['home-trust-bar','home-intro','home-process','process-grid','flash-section'])if(home.includes(obsolete))throw new Error('obsolete Home section remains: '+obsolete);
          console.log('Home i18n contract: PASS');
          NODE
      - name: Validate Persian-only storefront language contract
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('frontend/src/app.js','utf8');
          const d=JSON.parse(fs.readFileSync('frontend/public/i18n/fa.json','utf8'));
          if(d.version!==1||d.locale!=='fa'||d.direction!=='rtl')throw new Error('invalid Persian locale metadata');
          if(!/const SUPPORTED_LOCALES=\['fa'\]/.test(app))throw new Error('storefront is not Persian-only');
          if(/function mountLanguageSwitcher\(\)[^{]*\{(?![^]*Removed: storefront is Persian-only)/.test(app))throw new Error('language switcher still exposed');
          if(app.includes("/api/locale"))throw new Error('locale detection API must be disabled');
          console.log('Persian-only storefront language contract: PASS');
          NODE
      - name: Validate mobile release and PWA assets
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('frontend/public/mobile-release.json','utf8'));if(d.schemaVersion!==1||!d.web?.version||!d.web?.minimumVersion)process.exit(1);for(const p of ['android','ios']){if(typeof d[p]?.available!=='boolean'||!d[p]?.latestVersion||!d[p]?.minimumVersion)process.exit(1);if(d[p].available&&(!d[p].url||!/^https:\\/\\//.test(d[p].url)))process.exit(1)}"
          node --check frontend/public/sw.js
          test -f frontend/public/site.webmanifest
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('./frontend/public/site.webmanifest','utf8'));if(d.display!=='standalone'||!Array.isArray(d.icons)||!d.icons.length)process.exit(1)"
      - name: Validate service status document
        id: service
        run: |
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('frontend/public/service-status.json','utf8'));if(typeof d.paused!=='boolean'||!Number.isFinite(Number(d.requests))||!Number.isFinite(Number(d.limit))||!d.checkedAt)process.exit(1)"
          echo "paused=$(node -e "const d=require('./frontend/public/service-status.json');process.stdout.write(String(d.paused===true))")" >> "$GITHUB_OUTPUT"
      - name: Wait for Worker deployment of this commit
        if: steps.service.outputs.paused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=missing; conclusion=failure
          for i in $(seq 1 30); do
            run=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/worker-deploy.yml/runs?head_sha=${{ github.sha }}&per_page=1")
            status=$(echo "$run" | jq -r '.workflow_runs[0].status // "missing"')
            conclusion=$(echo "$run" | jq -r '.workflow_runs[0].conclusion // ""')
            echo "worker status=$status conclusion=$conclusion"
            if [ "$status" = completed ]; then break; fi
            sleep 10
          done
          test "$status" = completed
          test "$conclusion" = success
      - name: Smoke test production API
        if: steps.service.outputs.paused != 'true'
        env:
          API: https://api.gilasart.ir
          ORIGIN: https://gilasart.ir
        run: |
          set -euo pipefail
          for path in /api/health /api/home '/api/products?limit=1' /api/categories /api/flash-sales /api/settings; do
            body=$(mktemp)
            code=$(curl -sS --retry 2 --retry-all-errors -o "$body" -w '%{http_code}' "$API$path")
            echo "$path -> HTTP $code"
            test "$code" = 200
            rm -f "$body"
          done
          curl -fsS "$API/api/health" | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{const d=JSON.parse(s);if(d.ok!==true||d.db!==true)process.exit(1)})"
          echo "PASS: health"
          curl -fsS "$API/api/products?limit=1" | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{if(!Array.isArray(JSON.parse(s).items))process.exit(1)})"
          echo "PASS: products"
          curl -fsS "$API/api/products/Gilas411" | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{const d=JSON.parse(s);const a=d.attributes;if(!d.product||!Array.isArray(a)||a.length!==2)process.exit(1);const size=a.find(x=>x.name==='ابعاد'),frame=a.find(x=>x.name==='رنگ قاب');if(!size||!frame||size.options.length!==2||frame.options.length!==3)process.exit(1);if(!size.options.some(x=>x.name==='30x30'&&Number(x.is_default)===1&&Number(x.price_delta_irt)===0))process.exit(1);if(!size.options.some(x=>x.name==='70x70'&&Number(x.price_delta_irt)===80000000))process.exit(1);if(!frame.options.some(x=>x.name==='طلایی گلدار'&&Number(x.price_delta_irt)===8500000))process.exit(1)})"
          echo "PASS: Gilas411 options"
          curl -fsS "$API/api/products/Gilas020" | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{const d=JSON.parse(s);const a=d.attributes;if(!d.product||!Array.isArray(a)||a.length!==2)process.exit(1);const size=a.find(x=>x.name==='ابعاد'),frame=a.find(x=>x.name==='رنگ قاب');if(!size||!frame||size.options.length!==2||frame.options.length!==4)process.exit(1);if(!size.options.some(x=>x.name==='80x40'&&Number(x.is_default)===1&&Number(x.price_delta_irt)===0))process.exit(1);if(!size.options.some(x=>x.name==='110x60'&&Number(x.price_delta_irt)===85000000))process.exit(1);if(!frame.options.some(x=>x.name==='قهوه ای تنه درختی'&&Number(x.price_delta_irt)===6500000))process.exit(1)})"
          echo "PASS: Gilas020 options"
          curl -fsS "$API/api/categories" | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{if(!Array.isArray(JSON.parse(s).items))process.exit(1)})"
          echo "PASS: categories"
          curl -fsS "$API/api/home" | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{const d=JSON.parse(s);if(!Array.isArray(d?.products?.items)||!Array.isArray(d?.categories?.items)||!Array.isArray(d?.flash?.items)||!d?.settings?.settings)process.exit(1);if(d.products.items.length<1||d.categories.items.length<1)process.exit(1);if(!d.products.items.some(x=>String(x.name||'').trim()&&String(x.image||'').trim()))process.exit(1)})"
          echo "PASS: home"
          echo "D1 product option contract smoke test follows"
          curl -fsS "$API/api/storefront-snapshot" -o /tmp/storefront-snapshot.json
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('/tmp/storefront-snapshot.json','utf8');
          const d=JSON.parse(s);
          if(d?.meta?.schemaVersion!==1)throw new Error('snapshot schemaVersion invalid: '+d?.meta?.schemaVersion);
          for(const k of ['products','categories','reviews','articles','news'])if(!Array.isArray(d[k]))throw new Error('snapshot '+k+' is not an array');
          if(!d.settings||typeof d.settings!=='object')throw new Error('snapshot settings missing');
          if(d.products.length<1)throw new Error('snapshot has zero products');
          if(Number(d.meta.productCount)!==d.products.length)throw new Error('snapshot productCount mismatch: meta='+d.meta.productCount+' actual='+d.products.length);
          const missing=d.products.filter(p=>!p.id||!p.slug||!p.name||!Array.isArray(p.images)||!p.images.length).slice(0,5).map(p=>p.id||p.slug||'unknown');
          if(missing.length)throw new Error('snapshot products missing required image/data: '+missing.join(','));
          const sensitive=(s.match(/admin_bootstrap|kavenegar|invoice_|national_id|postal_code|economic_code/ig)||[]);
          if(sensitive.length)throw new Error('snapshot contains sensitive setting keys: '+[...new Set(sensitive.map(x=>x.toLowerCase()))].join(','));
          console.log(JSON.stringify({schemaVersion:d.meta.schemaVersion,productCount:d.meta.productCount,categoryCount:d.meta.categoryCount,reviewCount:d.meta.reviewCount}));
          NODE
          echo "Checking CORS preflight on canonical production API"
          cors_headers=$(curl -sS --retry 2 --retry-all-errors -D - -o /dev/null -X OPTIONS -H "Origin: https://gilasart.ir" -H "Access-Control-Request-Method: GET" "$API/api/health" | tr -d '\r')
          echo "$cors_headers" | grep -Fxi "access-control-allow-origin: https://gilasart.ir" >/dev/null || { echo "ERROR: canonical CORS origin header missing"; exit 1; }
          echo "$cors_headers" | grep -Fxi "access-control-allow-credentials: true" >/dev/null || { echo "ERROR: CORS credentials header missing"; exit 1; }
          echo "PASS: CORS preflight"
