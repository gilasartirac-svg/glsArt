name: Inspect Gilas407 product
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx wrangler d1 execute gilasartdatabase --remote --command="SELECT id,slug,sku,name,description,price_irt,seo_title,seo_description FROM products WHERE slug='Gilas407';" --config wrangler.toml
