name: Crop Product Images To Artwork Bounds

on:
  push:
    paths:
      - 'scripts/crop-uploaded-images.py'
      - '.github/workflows/crop-uploaded-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image processing dependencies
        run: |
          python -m pip install --disable-pip-version-check Pillow scipy

      - name: Crop white border from product images
        run: python scripts/crop-uploaded-images.py

      - name: Verify filenames and extensions are unchanged
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root=Path("frontend/public/uploaded")
          files=[p for p in root.iterdir() if p.is_file() and p.suffix.lower() in {".jpg",".jpeg",".png"}]
          if len(files) != 233:
              raise SystemExit(f"Unexpected product image count: {len(files)}")
          for p in files:
              if p.name != p.name.strip() or not p.suffix:
                  raise SystemExit(f"Invalid image filename: {p.name}")
          print(f"Verified {len(files)} product image filenames/extensions.")
          PY

      - name: Commit cropped originals
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/uploaded/*.jpg frontend/public/uploaded/*.jpeg frontend/public/uploaded/*.png frontend/public/uploaded/.crop-verification.txt
          if git diff --cached --quiet; then
            echo "No image changes."
            exit 0
          fi
          git commit -m "perf: crop product images to artwork bounds"
          git push
